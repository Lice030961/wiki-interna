services:
  - type: web
    name: wiki-premium-desktop
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn wiki_project.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "wiki-premium-desktop.onrender.com"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: READER_USERNAME
        value: leitor
      - key: READER_PASSWORD
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.10.6"
