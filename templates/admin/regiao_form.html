{% extends 'base.html' %}
{% block title %}{{ action }} Região{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-10">
  <div class="mb-6">
    <a href="{% url 'admin_regionais' %}" class="text-sm text-brand-red hover:underline">&larr; Voltar</a>
  </div>

  <h1 class="text-[28px] font-bold text-ink mb-8 tracking-[-1.2px]">{{ action }} Região</h1>

  <form method="post" class="space-y-5 bg-white border border-hairline rounded-2xl p-6">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-semibold text-body mb-1">Nome da Região <span class="text-brand-red">*</span></label>
      <input type="text" name="nome" required autofocus value="{{ obj.nome|default:'' }}"
             class="w-full border border-hairline rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-yellow" />
    </div>
    <div>
      <label class="block text-sm font-semibold text-body mb-1">Ícone (emoji)</label>
      <input type="text" name="icon" value="{{ obj.icon|default:'🌎' }}" maxlength="10"
             placeholder="Ex: 🌎"
             class="w-32 border border-hairline rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-yellow" />
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit"
              class="bg-brand-red text-white font-bold px-6 py-2.5 rounded-2xl hover:bg-brand-redhov transition text-sm">
        Salvar
      </button>
      <a href="{% url 'admin_regionais' %}"
         class="border border-hairline text-body px-6 py-2.5 rounded-2xl hover:bg-card transition text-sm font-medium">
        Cancelar
      </a>
    </div>
  </form>
</div>
{% endblock %}
