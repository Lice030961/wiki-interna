{% extends 'base.html' %}
{% block title %}Confirmar Exclusão{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-20 text-center">
  <div class="text-6xl mb-4">⚠️</div>
  <h1 class="text-xl font-extrabold text-gray-900 mb-2">Confirmar Exclusão</h1>
  <p class="text-gray-500 text-sm mb-6">
    Você está prestes a excluir o {{ type }} <strong>"{{ object }}"</strong>.<br/>
    Esta ação não pode ser desfeita.
  </p>

  <div class="flex justify-center gap-4">
    <form method="post">
      {% csrf_token %}
      <button type="submit"
              class="bg-red-600 text-white font-bold px-6 py-2.5 rounded-lg hover:bg-red-700 transition text-sm">
        Sim, excluir
      </button>
    </form>
    <a href="{% url 'admin_dashboard' %}"
       class="border border-gray-300 text-gray-600 px-6 py-2.5 rounded-lg hover:bg-gray-50 transition text-sm font-medium">
      Cancelar
    </a>
  </div>
</div>
{% endblock %}
