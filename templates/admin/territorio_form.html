{% extends 'base.html' %}
{% block title %}{{ action }} Território{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-10">
  <div class="mb-6">
    <a href="{% url 'admin_regionais' %}" class="text-sm text-brand-red hover:underline">&larr; Voltar</a>
  </div>

  <h1 class="text-[28px] font-bold text-ink mb-1 tracking-[-1.2px]">{{ action }} Território</h1>
  {% if regiao %}
  <p class="text-mute text-sm mb-8">Em: <span class="font-medium text-body">{{ regiao.nome }}</span></p>
  {% endif %}

  <form method="post" class="space-y-5 bg-white border-2 border-brand-red rounded-2xl p-6">
    {% csrf_token %}
    {% if regiao %}<input type="hidden" name="regiao_id" value="{{ regiao.id }}" />{% endif %}
    <div>
      <label class="block text-sm font-semibold text-body mb-1">Nome do Território <span class="text-brand-red">*</span></label>
      <input type="text" name="nome" required autofocus value="{{ obj.nome|default:'' }}"
             class="w-full border border-hairline rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-yellow" />
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit"
              class="bg-brand-red text-white font-bold px-6 py-2.5 rounded-2xl hover:bg-brand-redhov transition text-sm">
        Salvar
      </button>
      <a href="{% url 'admin_regionais' %}"
         class="border border-hairline text-body px-6 py-2.5 rounded-2xl hover:bg-card transition text-sm font-medium">
        Cancelar
      </a>
    </div>
  </form>
</div>
{% endblock %}
