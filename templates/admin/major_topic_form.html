{% extends 'base.html' %}
{% block title %}{{ action }} Tópico Principal{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-10">
  <div class="mb-6">
    <a href="{% url 'admin_dashboard' %}" class="text-sm text-brand-red hover:underline">&larr; Voltar ao painel</a>
  </div>

  <h1 class="text-[28px] font-bold text-ink mb-8 tracking-[-1.2px]">{{ action }} Tópico Principal</h1>

  <form method="post" class="space-y-5 bg-white border-2 border-brand-red rounded-2xl p-6">
    {% csrf_token %}

    <div>
      <label class="block text-sm font-semibold text-body mb-1">Título <span class="text-brand-red">*</span></label>
      <input type="text" name="title" required value="{{ topic.title|default:'' }}"
             class="w-full border border-hairline rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-yellow" />
    </div>

    <div>
      <label class="block text-sm font-semibold text-body mb-1">Ícone (emoji)</label>
      <input type="text" name="icon" value="{{ topic.icon|default:'' }}" maxlength="10"
             placeholder="Ex: 📌"
             class="w-full border border-hairline rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-yellow" />
    </div>

    <div>
      <label class="block text-sm font-semibold text-body mb-1">Descrição</label>
      <textarea name="description" rows="3"
                class="w-full border border-hairline rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-yellow resize-none">{{ topic.description|default:'' }}</textarea>
    </div>

    <div class="flex gap-3 pt-2">
      <button type="submit"
              class="bg-brand-red text-white font-bold px-6 py-2.5 rounded-2xl hover:bg-brand-redhov transition text-sm">
        Salvar
      </button>
      <a href="{% url 'admin_dashboard' %}"
         class="border border-hairline text-body px-6 py-2.5 rounded-2xl hover:bg-card transition text-sm font-medium">
        Cancelar
      </a>
    </div>
  </form>
</div>
{% endblock %}
